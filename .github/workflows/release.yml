name: Build and Release Mod

on:
  # 1. 允许手动点击按钮运行
  workflow_dispatch:
  
  # 2. 日常推送到 main 分支时运行 (仅编译，不上传 Release)
  push:
    branches:
      - main
      
  # 3. 核心：当在网页上发布 Release 时触发！
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 必须赋予写入权限，才能把 jar 传回 Release
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Build with Gradle
        run: gradle build --no-daemon

      # 无论是手动运行、推代码还是发版，都把 jar 存为 Artifact 方便随时下载
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tactical-villagers-jar
          path: build/libs/*.jar

      # 如果是发布 Release 触发的，自动把编译好的 jar 追加到 Release 附件里
      - name: Upload JAR to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: build/libs/*.jar
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}